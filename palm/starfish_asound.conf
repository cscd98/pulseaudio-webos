#ALSA config file to use pulse

# The default PCM device is pulseaudio

pcm.!default {
	type pulse
     device pdefaultapp
}

ctl.!default {
	type pulse
     device pdefaultapp
}


pcm.feedback {
        type pulse
	device pfeedback
}

pcm.media {
	type pulse
        device pmedia
}


pcm.defaultapp {
        type pulse
        device pdefaultapp
}


ctl.feedback {
        type pulse
	device pfeedback
}

ctl.media {
        type pulse
        device pmedia
}
ctl.defaultapp {
        type pulse
        device pdefaultapp
}

pcm.ringtones {
        type pulse
        device pringtones
}
ctl.ringtones {
        type pulse
        device pringtones
}
pcm.alerts {
        type pulse
        device palerts
}
ctl.alerts {
        type pulse
        device plerts
}
pcm.tts {
        type pulse
        device ptts
}
ctl.tts {
        type pulse
        device ptts
}
pcm.ndk {
        type pulse
        device pndk
}
ctl.ndk {
        type pulse
        device pndk
}
pcm.voicerecognition {
        type pulse
        device pvoicerecognition
}
ctl.voicerecognition {
        type pulse
        device pvoicerecognition
}
pcm.powersound {
        type pulse
        device ppowersound
}
ctl.powersound {
        type pulse
        device ppowersound
}
pcm.wowsound {
        type pulse
        device pwowsound
}
ctl.wowsound {
        type pulse
        device pwowsound
}
pcm.remote {
        type pulse
        device remote
}
ctl.remote {
        type pulse
        device remote
}
pcm.record {
        type pulse
        device precord
}
ctl.record {
        type pulse
        device precord
}
pcm.voipsource {
        type pulse
        device pvoipsource
}
ctl.voipsource {
        type pulse
        device pvoipsource
}
